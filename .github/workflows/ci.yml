name: Project CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, build and security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Security unit tests
        run: npm run test:security

      - name: Cross-shop API integration tests
        run: npm run test:security:integration

      - name: Firebase Emulator security tests
        run: npx --yes firebase-tools@15.37.0 emulators:exec --project demo-smart-mudi-security --only auth,firestore "npm run test:security:emulator"

      - name: Production build
        run: npm run build
